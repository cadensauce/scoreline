# Scoreline win probability: download free historical data, train one model per sport, backtest on the
# most recent full season against ESPN's live numbers, and commit models/ + reports/winprob/ to main.
# Run: gh workflow run winprob.yml -R cadensauce/scoreline [-f sports=nfl,nba]
name: Win probability

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated sports to (re)train: nfl,nba,cfb,f1"
        default: "nfl,nba,cfb,f1"
        required: false

permissions:
  contents: write

concurrency:
  group: winprob
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        sport: [nfl, nba, cfb, f1]
    steps:
      - name: Selected?
        run: |
          if [[ ",${{ inputs.sports }}," == *",${{ matrix.sport }},"* ]] && [ -n "${{ matrix.sport }}" ]; then echo "RUN=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.RUN == '1'
      - uses: actions/setup-python@v5
        if: env.RUN == '1'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model/requirements*.txt
      - name: Install Python packages
        if: env.RUN == '1'
        run: |
          pip install -r model/requirements.txt
          if [ "${{ matrix.sport }}" = "f1" ] && [ -f model/requirements-f1.txt ]; then pip install -r model/requirements-f1.txt; fi
      - name: Restore data cache
        if: env.RUN == '1'
        uses: actions/cache@v4
        with:
          path: model-data
          key: winprob-data-${{ matrix.sport }}-v1-${{ github.run_id }}
          restore-keys: winprob-data-${{ matrix.sport }}-v1-
      - name: Train and backtest
        if: env.RUN == '1'
        run: python -u model/train_${{ matrix.sport }}.py
      - uses: actions/setup-node@v4
        if: env.RUN == '1'
        with:
          node-version: 20
      - name: Check models/wp.js reproduces the Python predictions
        if: env.RUN == '1'
        run: node model/check_js.mjs ${{ matrix.sport }}
      - name: Package results
        if: env.RUN == '1'
        run: tar czf out-${{ matrix.sport }}.tgz models/wp-${{ matrix.sport }}.json reports/winprob/*-${{ matrix.sport }}.*
      - uses: actions/upload-artifact@v4
        if: env.RUN == '1'
        with:
          name: out-${{ matrix.sport }}
          path: out-${{ matrix.sport }}.tgz
          retention-days: 14

  commit:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: artifacts
          merge-multiple: true
      - name: Unpack
        run: |
          shopt -s nullglob
          for f in artifacts/*.tgz; do echo "unpack $f"; tar xzf "$f"; done
          pip install numpy==1.26.4 requests==2.32.3
          python model/build_report.py
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models reports/winprob
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Win probability: retrain and backtest (${{ inputs.sports }})" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
