# Scoreline tests: Playwright browser tests against the site served from this commit.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["design-review/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/report
