# Scoreline tests: Playwright browser tests against the site served from this commit,
# plus speed measurements (phone profile) and Lighthouse, compared with the live site.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ["design-review/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run tests
        run: mkdir -p screens && npx playwright test --grep-invert "speed:"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: tests/screens

  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Lighthouse
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund lighthouse@12.2.1 && npx playwright install --with-deps chromium
      - name: Phone-profile speed, this commit vs live site
        run: npx playwright test --grep "speed:" --workers=1 --retries=0
      - name: Lighthouse (mobile), this commit vs live site
        run: |
          (cd .. && python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())" 2>/dev/null || node -e "console.log(require('@playwright/test').chromium.executablePath())")
          for t in "thisCommit http://127.0.0.1:8080/index.html" "liveSite https://cadensauce.github.io/scoreline/"; do
            set -- $t
            CHROME_PATH="$CHROME" npx lighthouse "$2" --only-categories=performance --form-factor=mobile --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh-$1.json" || true
            node -e "const r=require('./lh-$1.json');const a=r.audits;console.log('LIGHTHOUSE $1', JSON.stringify({score:Math.round(r.categories.performance.score*100),fcp:a['first-contentful-paint'].displayValue,lcp:a['largest-contentful-paint'].displayValue,tbt:a['total-blocking-time'].displayValue,cls:a['cumulative-layout-shift'].displayValue,si:a['speed-index'].displayValue}))" || true
          done
      - name: Summary
        if: always()
        run: |
          { echo '### Speed (phone profile)'; echo '```json'; cat perf-results.json 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-results
          path: |
            tests/perf-results.json
            tests/lh-*.json

  # (screens are produced by the browser job; see the "screens" artifact)

  # Firestore security rules (picks, Marks, age answer) on the Firestore emulator.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install emulator and test tools
        run: npm install --no-save --no-audit --no-fund firebase-tools@13.29.1 @firebase/rules-unit-testing@3.0.4 firebase@10.12.2
      - name: Rules tests
        run: npx firebase emulators:exec --only firestore --project demo-scoreline "node --test"
