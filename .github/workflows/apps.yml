# Builds the Scoreline native apps (Rust + Tauri) and publishes them as a GitHub Release.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.1.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAURI_CLI: "@tauri-apps/cli@^2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare web files
        shell: bash
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest icon-192.png icon-512.png dist/
          # Every build gets a higher version so it installs over the previous one.
          sed -i -E 's/"version": "[0-9.]+"/"version": "1.0.${{ github.run_number }}"/' src-tauri/tauri.conf.json
          grep '"version"' src-tauri/tauri.conf.json
      - name: Install Tauri CLI
        run: npm install
      - name: Generate app icons
        run: npm run tauri -- icon icon-512.png
      - name: Build Windows installer
        run: npm run tauri -- build
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe out/Scoreline-Windows-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/Scoreline-Windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already ships the Android SDK; just add the NDK and build tools we need.
      - name: Install Android NDK
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Prepare web files
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest icon-192.png icon-512.png dist/
          # Every build gets a higher version so it installs over the previous one.
          sed -i -E 's/"version": "[0-9.]+"/"version": "1.0.${{ github.run_number }}"/' src-tauri/tauri.conf.json
          grep '"version"' src-tauri/tauri.conf.json
      - name: Install Tauri CLI
        run: npm install
      - name: Set up Android project
        run: |
          npm run tauri -- android init --ci
          npm run tauri -- icon icon-512.png
      - name: Add Android permissions (vibration for haptics)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' "$M"
          grep -n 'uses-permission' "$M"
      - name: Pin Kotlin to a published version
        working-directory: src-tauri/gen/android
        run: |
          grep -rlE 'kotlin[^"]*:2\.[0-9]+\.[0-9]+|kotlin.*version.*"2\.' . --include=*.kts --include=*.gradle --include=*.toml --include=*.properties || true
          grep -rlE '2\.3\.[0-9]+' . --include=*.kts --include=*.gradle --include=*.toml --include=*.properties | xargs -r sed -i -E 's/(kotlin[^"\n]*)2\.3\.[0-9]+/\12.1.21/g; s/"2\.3\.[0-9]+"/"2.1.21"/g'
          grep -rnE 'kotlin.*2\.[0-9]+\.[0-9]+' . --include=*.kts --include=*.gradle --include=*.toml || true
      - name: Add background alerts (Firebase Cloud Messaging)
        run: |
          A=src-tauri/gen/android/app
          GEN=$(find $A/src/main -name MainActivity.kt | head -1)
          echo "Generated activity: $GEN"
          cat "$GEN"
          # Keep the generated edge-to-edge behaviour exactly as it was.
          grep -q enableEdgeToEdge "$GEN" || sed -i '/enableEdgeToEdge/d' android/MainActivity.kt
          D=$(dirname "$GEN")
          cp android/MainActivity.kt android/ScorelineMessagingService.kt "$D/"
          mkdir -p $A/src/main/res/drawable $A/src/main/res/values
          cp android/ic_stat_scoreline.xml $A/src/main/res/drawable/
          cp android/firebase.xml $A/src/main/res/values/firebase.xml
          M=$A/src/main/AndroidManifest.xml
          grep -q ScorelineMessagingService "$M" || sed -i 's#</application>#    <service android:name=".ScorelineMessagingService" android:exported="false"><intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter></service>\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="scores" />\n    </application>#' "$M"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          G=$A/build.gradle.kts
          grep -q firebase-messaging "$G" || sed -i '0,/^dependencies {/s//dependencies {\n    implementation("com.google.firebase:firebase-messaging:24.1.0")/' "$G"
          grep -n firebase "$G" "$M"
      - name: Build APK
        run: npm run tauri -- android build --apk --ci
      - name: Sign APK
        run: |
          APK=$(find src-tauri/gen/android -name "*universal-release-unsigned.apk" | head -1)
          echo "Unsigned APK: $APK"
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > release.jks
            STOREPASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          else
            STOREPASS=scoreline-build
            keytool -genkeypair -v -keystore release.jks -alias scoreline -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STOREPASS" -keypass "$STOREPASS" -dname "CN=Scoreline"
          fi
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias scoreline --ks-pass "pass:$STOREPASS" --key-pass "pass:$STOREPASS" --out out/Scoreline-Android.apk aligned.apk
          "$BT/apksigner" verify out/Scoreline-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then TAG="build-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" out/* --title "Scoreline $TAG" --notes "Windows installer and Android APK for Scoreline." --latest
